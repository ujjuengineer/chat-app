Group Name : {{ chatroom.name }} <br>
LOgged IN as : {{ user.username }}
<hr>
<div id="chat-messages">
    {% for message in messages %}
        {{ message.user.username }} : {{ message.message_content }} <br>
    {% endfor %}
</div>
<hr>
<form method="post">
    {% csrf_token %}
    <input id="message-input" type="text" name="message" placeholder="Enter message">
    <button id="send-button" type="submit">Send</button>
</form>

{{ chatroom.slug|json_script:"json-chatroomname" }}
{{ request.user.username|json_script:"json-username" }}
<script>
    const chatRoomname = JSON.parse(document.getElementById('json-chatroomname').textContent)
    const username = JSON.parse(document.getElementById('json-username').textContent)
    // console.log(chatRoomname)
    const chatSocket = new WebSocket(
        'ws://'
        +window.location.host
        +'/ws/'
        +chatRoomname
        +'/'
    )
    chatSocket.onmessage = function(event){
        // console.log("this is message")
        const data = JSON.parse(event.data)
        if (data.message){
            // console.log('received message to client is : ', data.message)
            let html = data.username + " : " + data.message + '</br>'
            document.getElementById('chat-messages').innerHTML+=html 
        }else {
            alert("the message was empty !")
        }
    }
    chatSocket.onclose = function(event){
        console.log("socket closed")
    }


    document.getElementById('send-button').onclick = function(event){
        event.preventDefault()
        const messageInput = document.getElementById('message-input')
        const message = messageInput.value 
        console.log(message)

        chatSocket.send(JSON.stringify({
            'message':message,
            'username':username,
            'room':chatRoomname
        }))


        messageInput.value = "" 
    }
</script>
